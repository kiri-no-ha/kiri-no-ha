name: Generate SmilApple

on:
  schedule:
    - cron: "0 0 * * *" # Обновление раз в день
  workflow_dispatch: # Возможность запустить вручную

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SmilApple SVG
        run: |
          mkdir -p dist
          curl -L -o dist/smil-apple.svg https://raw.githubusercontent.com/Eiim/SmilApple/master/smil-apple.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: smil-apple
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
